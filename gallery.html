<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kusum KC | Portfolio</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Kusum KC — Dairy Technology student specializing in dairy processing, food safety, microbiology, and quality control. Explore my projects, research, and portfolio.">
    <meta name="keywords"
        content="Kusum, KC, KC Kusum, Kusum KC, Dairy Technology, Dairy Processing, Food Safety, Microbiology, Quality Control, Student, Nepal, Portfolio, Research, Projects">
    <meta name="author" content="Kusum KC">
    <meta name="robots" content="index, follow">

    <!-- Open Graph for better sharing -->
    <meta property="og:title" content="Kusum KC | Dairy Technology">
    <meta property="og:description"
        content="Portfolio of Kusum KC — Dairy Technology specializing in dairy processing, food safety, microbiology, and quality control.">
    <meta property="og:image" content="https://www.kusumkc.com.np/image/1.jpg">
    <meta property="og:url" content="https://www.kcKusum.com.np">
    <meta property="og:type" content="website">


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <!-- Google Fonts: Pacifico (Cursive) -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/x-icon" href="image/1.jpg" />
</head>

<body>  
    <!-- Navbar/ Header Section -->
    <div id="header"></div>

    <!-- Gallery Section -->
    <main class="container py-4">
        <h2 class="text-center mb-4">Photo Gallery</h2>
        <div class="row" id="gallery-row">
        </div>
    </main>

    <!-- Footer Section -->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Include Header & Footer via JS -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;

                const navbarCollapse = document.getElementById('navbarNav');
                const navbarToggler = document.querySelector('.navbar-toggler');

                // Initialize Bootstrap collapse
                const bsCollapse = new bootstrap.Collapse(navbarCollapse, { toggle: false });

                // Function to set 5-second auto-collapse
                function autoCollapseTimer() {
                    setTimeout(() => {
                        if (window.getComputedStyle(navbarToggler).display !== 'none' &&
                            navbarCollapse.classList.contains('show')) {
                            bsCollapse.hide();
                        }
                    }, 5000);
                }

                // Collapse on link click
                const navLinks = document.querySelectorAll('.navbar-collapse .nav-link');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        if (window.getComputedStyle(navbarToggler).display !== 'none') {
                            bsCollapse.hide();
                        }
                    });
                });

                // Start auto-collapse every time the navbar opens
                navbarToggler.addEventListener('click', () => {
                    if (window.getComputedStyle(navbarToggler).display !== 'none') {
                        // Only start timer if navbar is being opened
                        setTimeout(() => {
                            if (navbarCollapse.classList.contains('show')) {
                                bsCollapse.hide();
                            }
                        }, 5000);
                    }
                });
            });

        // Load footer
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
                document.getElementById("year").textContent = new Date().getFullYear();
            }); 
    </script>

    <!-- Link JS -->
    <script src="js/script.js"></script>

</body>

</html>
